name: Auto-merge
# Turns on GitHub auto-merge for safe PRs. GitHub then merges by itself once the
# required checks in the main-protection ruleset are green. Rules: docs/ops/autonomy.md
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, edited]
permissions:
  contents: write
  pull-requests: write
jobs:
  auto-merge:
    if: github.event.pull_request.draft == false && (github.actor == 'dependabot[bot]' || startsWith(github.head_ref, 'claude/'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Dependabot update type
        id: dependabot
        if: github.actor == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@v3
      - name: Decide whether Richard must look first
        id: gate
        env:
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          UPDATE_TYPE: ${{ steps.dependabot.outputs.update-type }}
          BASE: ${{ github.event.pull_request.base.sha }}
          ACTION: ${{ github.event.action }}
        run: |
          reasons=""
          label_only=""
          # A needs-richard label put on by this workflow is not a reason by itself: the
          # other checks below decide again on every run. Only a label added by a person
          # (anyone but github-actions) holds the PR.
          case ",$LABELS," in *,needs-richard,*)
            labeller=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/events" --paginate \
              --jq '[.[] | select(.event=="labeled" and .label.name=="needs-richard")] | last | .actor.login' || true)
            if [ "$labeller" != "github-actions[bot]" ]; then
              reasons="$reasons label needs-richard;"
              label_only="yes"
            fi ;;
          esac
          if printf '%s' "$BODY" | grep -qiE '^- \[x\] Yes'; then reasons="$reasons cost-or-permissions box ticked;"; label_only=""; fi
          if [ "$GITHUB_ACTOR" = "dependabot[bot]" ] && [ "$UPDATE_TYPE" != "version-update:semver-patch" ] && [ "$UPDATE_TYPE" != "version-update:semver-minor" ]; then
            reasons="$reasons dependency update is not patch/minor ($UPDATE_TYPE);"; label_only=""
          fi
          protected=$(git diff --name-only "$BASE"...HEAD | grep -E '^(AGENTS\.md|docs/spec\.md|wrangler\.jsonc|\.github/|datasets/[^/]+/(dataset\.yaml|LICENCE.*|.*mapping.*|.*direction.*)|docs/adr/)' || true)
          if [ -n "$protected" ]; then reasons="$reasons protected files changed ($(echo $protected | tr '\n' ' '));"; label_only=""; fi
          echo "reasons=$reasons" >> "$GITHUB_OUTPUT"
          echo "label_only=$label_only" >> "$GITHUB_OUTPUT"
      - name: Enable auto-merge (squash)
        if: steps.gate.outputs.reasons == ''
        run: |
          gh pr edit "$PR" --remove-label needs-richard || true
          gh pr merge "$PR" --auto --squash
      - name: Hold for Richard
        if: steps.gate.outputs.reasons != ''
        run: |
          # A push (for example merging main to fix a conflict) must not switch off auto-merge
          # that a person turned on for a PR held only by their own needs-richard label.
          if [ "$ACTION" != "synchronize" ] || [ "${{ steps.gate.outputs.label_only }}" != "yes" ]; then
            gh pr merge "$PR" --disable-auto || true
          fi
          gh label create needs-richard --color D93F0B --description "Richard must look before this merges" || true
          gh pr edit "$PR" --add-label needs-richard
          echo "Not auto-merging:${{ steps.gate.outputs.reasons }}"
