name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail on large or data files
        run: |
          bad=$(git ls-files | grep -E '\.(parquet|tsv|tar\.gz|zip)$' || true)
          big=$(git ls-files -z | xargs -0 du -k | awk '$1>1024{print $2}')
          if [ -n "$bad$big" ]; then echo "Data or large files found:"; echo "$bad"; echo "$big"; exit 1; fi
      - name: Required docs exist
        run: test -f docs/spec.md && test -f AGENTS.md
  data-pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: datasets/biogrid-orcs/requirements.txt
      - run: pip install -r datasets/biogrid-orcs/requirements.txt
      - name: Adapter unit tests
        run: python -m unittest discover -s datasets/biogrid-orcs/tests -v
      - name: Cell line context unit tests
        run: python -m unittest discover -s datasets/cell-line-context/tests -v
      - name: Pathways unit tests
        run: python -m unittest discover -s datasets/pathways/tests -v
      - name: Associations unit tests
        run: python -m unittest discover -s datasets/associations/tests -v
      - name: Reproducibility unit tests
        run: python -m unittest discover -s datasets/reproducibility/tests -v
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pip install -r tests/reference/requirements.txt
      - name: Recipe statistics against SciPy (independent reference, spec section 14)
        run: python -m unittest discover -s tests/reference -v
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Build
        run: npm run build
      - name: Dependency audit (high severity and above)
        run: npm audit --audit-level=high
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Smoke and accessibility tests
        run: npm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
