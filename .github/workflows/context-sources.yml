# M3b: download Cellosaurus and DepMap, match ORCS cell lines, build the cell line tables, report.
# Runs on PRs that change the context pipeline, and by hand. Publishes nothing; the report is a run artifact
# and is also printed to the log.
name: "Cell line context: sources and matching"
on:
  workflow_dispatch:
  pull_request:
    paths:
      - datasets/cell-line-context/**
      - .github/workflows/context-sources.yml
permissions:
  contents: read
concurrency:
  group: context-sources-${{ github.ref }}
  cancel-in-progress: true
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: datasets/biogrid-orcs/requirements.txt
      - run: pip install -r datasets/biogrid-orcs/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s datasets/cell-line-context/tests -v
      - name: Fetch sources and match cell lines
        run: python -I datasets/cell-line-context/fetch_map.py "$RUNNER_TEMP/ctx"
      - name: Build cell line tables (mutations, expression, copy number, signatures)
        run: python -I datasets/cell-line-context/build.py "$RUNNER_TEMP/ctx"
      - name: Sizes
        if: always()
        run: du -sh "$RUNNER_TEMP"/ctx/out/context/* "$RUNNER_TEMP/ctx/site/ctx" || true
      - name: Report to job summary
        if: always()
        run: cat "$RUNNER_TEMP/ctx/out/report.md" "$RUNNER_TEMP/ctx/out/context/build_report.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cell-line-context-report
          path: |
            ${{ runner.temp }}/ctx/out/*.csv
            ${{ runner.temp }}/ctx/out/*.md
            ${{ runner.temp }}/ctx/out/context/*.md
          retention-days: 30
