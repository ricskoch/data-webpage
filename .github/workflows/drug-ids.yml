# Drug plan step 2: look up PubChem and ChEMBL identifiers for every drug label in BioGRID ORCS.
# Manual only. Publishes nothing: the draft mapping is a run artifact for a person to review, then commit as
# datasets/biogrid-orcs/drugs.yaml. PubChem and ChEMBL are public web services (no key, no cost); calls are rate limited.
name: Draft drug identifiers
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drug-ids
  cancel-in-progress: false
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: datasets/biogrid-orcs/requirements.txt
      - run: pip install -r datasets/biogrid-orcs/requirements.txt
      - name: Fetch, validate, convert
        run: |
          python -I datasets/biogrid-orcs/ingest.py fetch "$RUNNER_TEMP/orcs"
          python -I datasets/biogrid-orcs/ingest.py convert "$RUNNER_TEMP/orcs"
      - name: Look up drug names
        run: python -I datasets/biogrid-orcs/fetch_drugs.py "$RUNNER_TEMP/orcs"
      - name: Report to job summary
        if: always()
        run: cat "$RUNNER_TEMP/orcs/drugs/drugs_report.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drug-identifier-draft
          path: ${{ runner.temp }}/orcs/drugs/*
          retention-days: 30
