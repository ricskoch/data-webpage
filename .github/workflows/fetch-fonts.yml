# One-off job (approved by the owner 2026-10-11): copies the two OFL web fonts into
# public/fonts so the site self-hosts them. Deleted again after it has run once.
name: Fetch web fonts (one-off)
on:
  push:
    branches: [claude/project-thread-9t0ddn]
    paths: ['.github/workflows/fetch-fonts.yml']
permissions:
  contents: write
jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download font packages and copy the Latin files
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          (cd "$tmp" && npm pack @fontsource-variable/playfair-display@5 @fontsource-variable/source-serif-4@5 >/dev/null)
          mkdir -p public/fonts
          for t in "$tmp"/*.tgz; do mkdir -p "$tmp/x" && tar -xzf "$t" -C "$tmp/x"; name=$(node -p "require('$tmp/x/package/package.json').name.split('/')[1]"); \
            cp "$tmp/x/package/LICENSE" "public/fonts/$name-OFL.txt"; ls "$tmp/x/package/files" | grep -E '^[a-z0-9-]+-latin-(wght|opsz)-(normal|italic)\.woff2$' | while read f; do cp "$tmp/x/package/files/$f" public/fonts/; done; rm -rf "$tmp/x"; done
          ls -la public/fonts
          test -n "$(ls public/fonts/*.woff2)"
      - name: Commit the fonts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/fonts
          git commit -m "Add self-hosted web fonts (Playfair Display, Source Serif 4; SIL OFL)"
          git push
