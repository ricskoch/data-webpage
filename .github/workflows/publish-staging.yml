# Prototype: build the BioGRID ORCS data and upload it to the R2 staging bucket so the preview site can read it.
# Manual only (Actions tab > "Publish data to R2 staging" > Run workflow). Needs the R2_* repository secrets.
# Staging is not a data release: the bioinformatician review and the data-release gate (spec 6.3) still apply.
name: Publish data to R2 staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-staging
  cancel-in-progress: false
env:
  R2_BUCKET: data-webpage-staging
  PREFIX: biogrid-orcs/0.1.0-staging
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: datasets/biogrid-orcs/requirements.txt
      - run: pip install -r datasets/biogrid-orcs/requirements.txt
      - name: Fetch, validate, convert
        run: |
          python -I datasets/biogrid-orcs/ingest.py fetch "$RUNNER_TEMP/orcs"
          python -I datasets/biogrid-orcs/ingest.py convert "$RUNNER_TEMP/orcs"
      - name: Build site bundle (JSON)
        run: python -I datasets/biogrid-orcs/export_site.py "$RUNNER_TEMP/orcs"
      - name: Compress JSON
        run: find "$RUNNER_TEMP/orcs/site" -name '*.json' -exec gzip -9 -n {} \; -exec sh -c 'mv "$1.gz" "$1"' _ {} \;
      - name: Size check (stay far below the 10 GB free tier)
        run: |
          du -sh "$RUNNER_TEMP/orcs/site" "$RUNNER_TEMP/orcs/out"
          total=$(du -sk "$RUNNER_TEMP/orcs/site" "$RUNNER_TEMP/orcs/out" | awk '{s+=$1} END {print s}')
          test "$total" -lt 3000000 || { echo "upload over 3 GB, stopping"; exit 1; }
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 sync "$RUNNER_TEMP/orcs/site" "s3://$R2_BUCKET/$PREFIX/site" --endpoint-url "$ENDPOINT" \
            --content-type application/json --content-encoding gzip --cache-control "public, max-age=3600" --only-show-errors
          for f in "$RUNNER_TEMP"/orcs/out/*.parquet "$RUNNER_TEMP"/orcs/out/manifest.json "$RUNNER_TEMP"/orcs/out/validation_report.json; do
            aws s3 cp "$f" "s3://$R2_BUCKET/$PREFIX/$(basename "$f")" --endpoint-url "$ENDPOINT" --only-show-errors
          done
          echo "uploaded to $R2_BUCKET/$PREFIX"
