# Reviewed treatment names (F20). A person checks each name the automatic lookup could not settle.
# Key: the name as written in ORCS (after splitting a label on "|" and " + "). Fields:
#   canonical   the name to look up in PubChem and ChEMBL (a list for two compounds in one label); null = no identifier expected
#   kind        what the name is (categories in treatment_classes.yaml); beats the word rules there
#   confidence  high / medium / low; low means "could not be identified, check the study"
#   note        why, in plain words
#   also_try    other spellings to try if canonical finds nothing in PubChem
#   accept_first  true = several PubChem entries (isomers, salts) count as mapped to the first one, flagged
# Proposed 2026-10-18; Richard confirms by merging. Identifiers are filled in by re-running "Draft drug identifiers".
