# Cell line context (M3b): who each screened cell line is, and later its mutations, expression and copy number.
# Approved as sources by Richard on 2026-10-11 (thread "M3"). Licences must be confirmed from the
# evidence in report.md before anything is published.
id: cell-line-context
taxon: "9606"
sources:
  cellosaurus:
    url: https://ftp.expasy.org/databases/cellosaurus/cellosaurus.txt
    licence_page: https://www.cellosaurus.org/description.html
    licence_expected: CC BY 4.0   # to confirm
  orcs_screens:
    # The prototype site bundle already lists every ORCS screen with its cell line label.
    url: https://pub-fe3fcf6faccd4f81b4acaee420db9af5.r2.dev/biogrid-orcs/0.1.0-staging/site/screens.json
  depmap:
    listing_url: https://depmap.org/portal/api/download/files
    licence_page: https://depmap.org/portal/terms/
    licence_expected: CC BY 4.0   # to confirm
    release_pattern: "^DepMap Public"
    # The portal API answers scripts with a browser check (seen 2026-10-11), so fall back to the figshare mirror.
    figshare_api: https://api.figshare.com/v2
    figshare_search: https://api.figshare.com/v2/articles/search
    figshare_query: DepMap Public
    figshare_title_pattern: "^DepMap \\d{2}Q\\d Public$"
    # File names change between releases, so match by pattern; the report lists what was found.
    files:
      models: "^Model\\.csv$"
      profiles: "^OmicsProfiles\\.csv$"
      signatures: "^OmicsSignatures.*\\.csv$"
      mutations: "^OmicsSomaticMutations\\.csv$"
      expression: "^OmicsExpression.*ProteinCoding.*TPMLogp1.*\\.csv$"
      copy_number: "^OmicsCNGene.*\\.csv$"
      arm_cna: "^OmicsArmLevelCNA.*\\.csv$"

# ORCS cell line label -> Cellosaurus accession, for names the matcher reports as ambiguous or not found.
# Every entry needs a reason in a comment. Changes are reviewed as diffs of this file.
overrides: {}

build:
  # Genes shown on the context card ("which well-known cancer genes are mutated in this line").
  driver_panel: [TP53, KRAS, NRAS, HRAS, BRAF, PIK3CA, PTEN, APC, CTNNB1, CDKN2A, RB1, SMAD4, ARID1A, SMARCA4,
                 NF1, EGFR, ERBB2, STK11, KEAP1, IDH1, FBXW7, BRCA1, BRCA2, ATM, MTAP]
