# Reactome pathways (F20 gene selection): which human genes belong to which pathway, for the gene picker on /gene.
# Source and use requested by Richard on 2026-10-18 ("reactome pathway filters"). The licence must be confirmed from the
# evidence in report.md (the build records the licence page text) before this is published.
id: pathways
taxon: "9606"
sources:
  reactome:
    # Human pathways with HGNC gene symbols, one pathway per line (GMT format).
    url: https://reactome.org/download/current/ReactomePathways.gmt.zip
    release_url: https://reactome.org/ContentService/data/database/version
    licence_page: https://reactome.org/license
    licence_expected: CC0 1.0 or CC BY 4.0   # to confirm from report.md
    citation: "Milacic M, et al. The Reactome Pathway Knowledgebase 2024. Nucleic Acids Res. 2024."
